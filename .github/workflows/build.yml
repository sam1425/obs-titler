name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.0.3)'
        required: true
        default: 'v0.0.3'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            data_sep: ";"
            ext: ".exe"
          - os: ubuntu-latest
            data_sep: ":"
            ext: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (Essentials only)
        run: |
          uv sync
          uv add --dev pyinstaller

      - name: Build Fast Instant-Launch Directory (--onedir)
        run: |
          uv run pyinstaller --noconsole --onedir --name "obs-titler" --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtPdf --exclude-module PySide6.QtQuick3D --add-data "main.qml${{ matrix.data_sep }}." main.py

      - name: Build Lightweight Portable Single File (--onefile)
        run: |
          uv run pyinstaller --noconsole --onefile --name "obs-titler-portable" --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtPdf --exclude-module PySide6.QtQuick3D --add-data "main.qml${{ matrix.data_sep }}." main.py

      - name: Package Assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release_assets
          # Zip the instant-launch directory
          cd dist
          7z a ../release_assets/obs-titler-windows.zip obs-titler
          cd ..
          # Copy portable single-file exe
          cp dist/obs-titler-portable.exe release_assets/obs-titler-windows-portable.exe

      - name: Package Assets (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release_assets
          # Tar the instant-launch directory
          cd dist
          tar -czf ../release_assets/obs-titler-linux.tar.gz obs-titler
          cd ..
          # Copy portable single-file binary
          cp dist/obs-titler-portable release_assets/obs-titler-linux-portable

      - name: Upload temporary build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}
          path: release_assets/*

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Determine tag name
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
