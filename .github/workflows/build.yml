name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a tag like v1.0.0
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write # Required to create releases and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built_path: dist/obs-sermon-controller.exe
            release_asset: obs-sermon-controller-windows.exe
            data_sep: ";"
          - os: ubuntu-latest
            built_path: dist/obs-sermon-controller
            release_asset: obs-sermon-controller-linux
            data_sep: ":"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync
          uv add --dev pyinstaller

      - name: Build standalone executable
        run: |
          uv run pyinstaller --noconsole --onefile --name "obs-sermon-controller" --add-data "main.qml${{ matrix.data_sep }}." main.py

      - name: Rename binary for release
        shell: bash
        run: |
          mkdir -p release_assets
          cp "${{ matrix.built_path }}" "release_assets/${{ matrix.release_asset }}"

      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_asset }}
          path: release_assets/${{ matrix.release_asset }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Determine tag name
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
